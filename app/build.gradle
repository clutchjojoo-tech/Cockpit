plugins {
    id 'com.android.application'
}

android {
    namespace 'com.golf6.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.golf6.home'
        minSdk 21
        targetSdk 34
        versionCode 38
        versionName '3.6.2'
    }

    signingConfigs {
        debug {
            storeFile file('cockpit.keystore')
            storePassword 'cockpit2026'
            keyAlias 'cockpit'
            keyPassword 'cockpit2026'
        }
    }

    buildTypes {
        // 3.2 : version « release » optimisée (R8). L'APK publié reste pour l'instant le debug (même clé, mises à jour inchangées).
        // 3.6.2 : l'APK publié est la version « release » (non débogable = plus rapide), signée avec la MÊME clé que avant.
        // Pas de R8 (minify) : aucun risque de casser le pont JavaScript ; le gain de vitesse vient du mode non débogable.
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Anciennes images 3D (dossiers d et dj) encore présentes dans le dépôt : pas mises dans l'APK
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>d:<dir>dj:f_*.js:golf6.js:three3d.js:m3d.js'
    }

    // 3.6.2 : la vérification automatique (lint) des versions release ne bloque pas la fabrication
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
