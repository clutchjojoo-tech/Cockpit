plugins {
    id 'com.android.application'
}

android {
    namespace 'com.golf6.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.golf6.home'
        minSdk 21
        targetSdk 34
        versionCode 21
        versionName '2.1'
    }

    signingConfigs {
        debug {
            storeFile file('cockpit.keystore')
            storePassword 'cockpit2026'
            keyAlias 'cockpit'
            keyPassword 'cockpit2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
