plugins {
    id 'com.android.application'
}

android {
    namespace 'com.golf6.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.golf6.home'
        minSdk 21
        targetSdk 34
        versionCode 31
        versionName '3.1'
    }

    signingConfigs {
        debug {
            storeFile file('cockpit.keystore')
            storePassword 'cockpit2026'
            keyAlias 'cockpit'
            keyPassword 'cockpit2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Anciennes images 3D (dossiers d et dj) encore présentes dans le dépôt : pas mises dans l'APK
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>d:<dir>dj:f_*.js:golf6.js:three3d.js:m3d.js'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
