
name: Fabriquer l'application

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_SHA256: "3F:65:36:19:D1:04:80:04:54:55:1E:8B:18:26:5F:64:8E:37:5B:2E:1E:CB:8E:B5:12:BC:40:CD:8C:2E:6D:5D"

jobs:
  verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Accepter les licences Android
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Vérifier le projet
        shell: bash
        run: |
          set -o pipefail
          gradle :app:processDebugManifest \
            :app:processDebugResources \
            :app:compileDebugJavaWithJavac \
            :app:mergeDebugAssets \
            --no-daemon --stacktrace 2>&1 | tee verification.log

      - name: Publier le journal de vérification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-verification
          path: verification.log
          if-no-files-found: ignore

  build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'clutchjojoo-tech/Cockpit' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04

    steps:
      - id: s1
        name: Récupérer le code
        uses: actions/checkout@v4
        continue-on-error: true

      - id: s2
        name: Installer Java 17
        uses: actions/setup-java@v5
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'

      - id: s3
        name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - id: s3a
        name: Accepter les licences Android
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses

      - id: s4
        name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.7'

      - id: s5
        name: Fabriquer l'APK
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - id: s6
        name: Vérifier la signature
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -f "$APK"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee sig.log
          EXPECTED=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          ACTUAL=$(grep "certificate SHA-256 digest" sig.log | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERREUR : signature SHA-256 différente."
            exit 1
          fi
          echo "Signature Cockpit vérifiée."

      - name: Bilan
        if: always()
        shell: bash
        run: |
          echo "Checkout: ${{ steps.s1.outcome }}"
          echo "Java: ${{ steps.s2.outcome }}"
          echo "SDK Android: ${{ steps.s3.outcome }}"
          echo "Licences Android: ${{ steps.s3a.outcome }}"
          echo "Gradle: ${{ steps.s4.outcome }}"
          echo "Compilation: ${{ steps.s5.outcome }}"
          echo "Signature: ${{ steps.s6.outcome }}"
          if [ "${{ steps.s1.outcome }}" != "success" ] ||
             [ "${{ steps.s2.outcome }}" != "success" ] ||
             [ "${{ steps.s3.outcome }}" != "success" ] ||
             [ "${{ steps.s3a.outcome }}" != "success" ] ||
             [ "${{ steps.s4.outcome }}" != "success" ] ||
             [ "${{ steps.s5.outcome }}" != "success" ] ||
             [ "${{ steps.s6.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Publier l'APK
        if: always() && steps.s5.outcome == 'success' && steps.s6.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-build
          path: |
            build.log
            sig.log
          if-no-files-found: ignore
