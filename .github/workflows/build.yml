name: Fabriquer l'application

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fabriquer l'APK
        run: |
          gradle assembleRelease --no-daemon
          # 3.6.2 : version release, gardée sous le nom habituel pour le site et les mises à jour
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: accueil-golf6-apk
          path: app/build/outputs/app-debug.apk
