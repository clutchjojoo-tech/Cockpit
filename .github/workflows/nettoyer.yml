name: Nettoyer les fichiers inutiles
# À lancer UNE SEULE FOIS à la main (Actions > Nettoyer les fichiers inutiles > Run workflow).
# Supprime du dépôt les fichiers listés ci-dessous (images et scripts que Cockpit 3.0 n'utilise plus).
# Ne touche ni au keystore, ni à la signature, ni au système de mise à jour. Tu peux ensuite supprimer ce fichier.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nettoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supprimer
        run: |
          cat > liste.txt <<'LISTE'
          app/src/main/assets/m3d/dive.mp4
