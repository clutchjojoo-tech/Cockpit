name: Bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler le problème. Plus tu donnes de détails, plus vite on peut le corriger.
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Décris ce que tu vois et ce que tu attendais.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      placeholder: |
        1. J'ouvre…
        2. Je touche…
        3. Il se passe…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Cockpit
      description: Visible dans les réglages, à la ligne « Version ».
      placeholder: "2.5"
    validations:
      required: true
  - type: input
    id: poste
    attributes:
      label: Modèle du poste ou de la tablette
      placeholder: "ESSGOO, Android 14, 1280×720"
    validations:
      required: true
  - type: input
    id: can
    attributes:
      label: Boîtier CAN ou application (si tu le sais)
      placeholder: "CarCAN, Raise, aucun…"
  - type: textarea
    id: capture
    attributes:
      label: Capture d'écran ou vidéo
      description: Tu peux glisser un fichier ici.
